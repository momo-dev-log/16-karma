name: Fix weapon charge details
on:
  push:
    branches:
      - refactor/split-alpha-5-62-assets
    paths:
      - scripts/fix_weapon_charge.py
      - .github/workflows/fix-weapon-charge.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted fix
        run: python3 scripts/fix_weapon_charge.py
      - name: Verify JS and assets
        run: node split-alpha-5.62/scripts/verify_split.js
      - name: Commit corrected HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add split-alpha-5.62/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Fix weapon detail charge labels to show /6"
            git push origin HEAD:refactor/split-alpha-5-62-assets
          fi
