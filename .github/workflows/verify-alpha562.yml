name: Verify alpha 5.62 combat UI
on:
  push:
    branches:
      - refactor/split-alpha-5-62-assets
    paths:
      - split-alpha-5.62/**
      - .github/workflows/verify-alpha562.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify split images and JavaScript syntax
        run: node split-alpha-5.62/scripts/verify_split.js
      - name: Test real combat status functions
        run: node split-alpha-5.62/scripts/test_status.js
      - name: Test turn progression and enemy damage
        run: node split-alpha-5.62/scripts/test_turn.js
      - name: Test enemy forecasts against hit and ailment rules
        run: node split-alpha-5.62/scripts/test_forecast.js
      - name: Test queued attacks and boss break mechanics
        run: node split-alpha-5.62/scripts/test_boss.js
      - name: Exercise actual queued attack functions
        run: node split-alpha-5.62/scripts/test_actual_attack.js
      - name: Exercise boss break threshold and rapid target switching
        run: node split-alpha-5.62/scripts/test_break_sequence.js
      - name: Exercise boss part stun recovery
        run: node split-alpha-5.62/scripts/test_stun_recovery.js
      - name: Test combined enemy hits and lethal poison
        run: node split-alpha-5.62/scripts/test_multi_hit_poison.js
